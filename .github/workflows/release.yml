name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)"
          header="$(sed -nE 's/^#define MOLLUSK_CXX_VERSION "([^"]+)"/\1/p' include/mollusk.h)"
          echo "tag=$tag Cargo.toml=$crate header=$header"
          [ "$tag" = "$crate" ] && [ "$tag" = "$header" ]

  package:
    needs: verify
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04,     platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-15,         platform: darwin-arm64 }
          - { os: macos-15-intel,   platform: darwin-x64 }
    steps:
      - uses: actions/checkout@v5
      - run: make test
      - name: Tarball
        run: |
          name="mollusk-cxx-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "dist/$name/include" "dist/$name/lib"
          cp include/mollusk.h "dist/$name/include/"
          cp libs/${{ matrix.platform }}/libmollusk.a "dist/$name/lib/"
          cp LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*.tar.gz

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes -- *.tar.gz SHA256SUMS
