name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  committed-libs:
    name: libs/${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-15,         platform: darwin-arm64 }
          - { os: macos-15-intel,   platform: darwin-x64 }
    steps:
      - uses: actions/checkout@v5
      - name: Smoke test against fixtures
        run: |
          if [ ! -f libs/${{ matrix.platform }}/libmollusk.a ]; then
            echo "::warning::libs/${{ matrix.platform }} not committed yet"
            exit 0
          fi
          make test

  source:
    name: Build from source (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: macos-15,     platform: darwin-arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: make lib test
      - run: cargo clippy --release --locked -- -D warnings
